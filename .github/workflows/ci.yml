name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Build de l'image Docker
        run: docker build -t univers-project-app ./app

      - name: Lancer le conteneur
        run: docker run -d -p 5000:5000 --name univers-project univers-project-app

      - name: Attendre que le conteneur démarre
        run: sleep 3

      - name: Tester le endpoint
        run: curl --fail http://localhost:5000

      - name: Arrêter le conteneur
        run: docker stop univers-project

  publish:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion à GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build et publication de l'image
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/univers-project:latest
          docker build -t "$IMAGE" ./app
          docker push "$IMAGE"

  deploy:
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Déployer sur la VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/univers-project:latest
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy "$VM_USER@$VM_HOST" \
            "docker pull $IMAGE && docker rm -f univers || true && docker run -d --name univers --restart unless-stopped -p 80:5000 $IMAGE"
